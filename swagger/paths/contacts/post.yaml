tags:
  - Contacts
summary: Add a contact
operationId: addContact
description: 'Add a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Ivan Ivanenko'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380000000009'
          email:
            description: "Contact's email"
            type: string
            example: 'vasyl9@example.com'
          isFavourite:
            description: 'Is contact favourite?'
            type: boolean
            example: true
          contactType:
            description: "Contact's type"
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: "Contact's photo"
            type: string
            format: binary
            example: 'https://res.cloudinary.com/dejgpfl3t/image/upload/v1746969436/vw6laqn2…'
responses:
  '201':
    description: Add a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
